name: debt_cash_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  qr_flutter: ^4.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  flutter_riverpod: any
  shared_preferences: any
  path_provider: any
  uuid: any
  crypto: any
  realm: any
  image_picker: any
  share_plus: any
  permission_handler: any
  flutter_contacts: any
  pdf: any
  printing: any
  flutter_local_notifications: ^17.0.0
  timezone: any
  local_auth: any
  flutter_secure_storage: any
  go_router: any
  file_picker: ^8.1.2
  url_launcher: ^6.3.2
  arabic_reshaper: ^0.0.1
  bidi: ^2.0.13
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: any

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/
